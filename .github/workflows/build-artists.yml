name: Régénérer la page depuis data/artists_grid.json

on:
  push:
    paths:
      - "data/artists_grid.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Régénère index.html
        run: python3 scripts/build_artists_floors.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "Régénère index.html depuis data/artists_grid.json [auto]"
            git push
          else
            echo "Aucun changement dans index.html"
          fi
