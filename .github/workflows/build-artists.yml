name: Régénérer la page depuis data/artists_grid.json

on:
  push:
    paths:
      - "data/artists_grid.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Régénère index.html
        run: python3 scripts/build_artists_floors.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet index.html; then
            echo "Aucun changement dans index.html"
            exit 0
          fi
          git add index.html
          git commit -m "Régénère index.html depuis data/artists_grid.json [auto]"
          # L'outil admin peut faire plusieurs commits coup sur coup (JSON
          # puis suppression de la photo) : si un autre commit est arrivé
          # entre-temps, on rebase et on réessaie plutôt que d'échouer.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejeté, nouvelle tentative ($i/5)..."
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::Échec du push après plusieurs tentatives."
          exit 1
